name: DJ Music Windows 构建
on:
  workflow_dispatch:
  push:
    branches: [main, release/dj-music-0.5.1]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'windows/**'
      - 'scripts/build_video_windows.ps1'
      - 'scripts/build_windows_lx_host.ps1'
      - 'installer/yueyin.iss'
      - 'docs/交付文档/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.github/workflows/yueyin-windows.yml'
permissions:
  contents: read
env:
  PUB_HOSTED_URL: 'https://pub.flutter-io.cn'
concurrency:
  group: yueyin-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: 获取依赖
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- pubspec.lock
      - name: 完整静态检查和回归
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test --no-pub -j 1
          exit $LASTEXITCODE
      - name: 编译独立宿主、原生验收与发行包
        shell: powershell
        run: ./scripts/build_video_windows.ps1 -FlutterSdk $env:FLUTTER_ROOT -DependencyDirectory "$env:RUNNER_TEMP/yueyin-native"
      - uses: actions/upload-artifact@v4
        with:
          name: dj-music-0.5.1-windows-x64
          path: build/yueyin-release/*
          if-no-files-found: error
          retention-days: 14
