function setQueue(value){if(value){closeChoice();closeSongMenu()}state.queue=value;document.getElementById('queue-drawer').hidden=!value;document.getElementById('queue-toggle').classList.toggle('active',value);document.getElementById('queue-toggle').setAttribute('aria-expanded',String(value))}
document.addEventListener('click',e=>{const option=e.target.closest('[data-choice-option]');if(option){commitChoice(Number(option.dataset.choiceOption));return}const b=e.target.closest('button');if(!e.target.closest('#choice-menu')&&!b?.hasAttribute('data-choice'))closeChoice();if(b?.dataset.choice){openChoice(b);return}if(!e.target.closest('#song-menu')&&!b?.hasAttribute('data-more'))closeSongMenu();if(!b)return;
if(b.dataset.more!==undefined){openSongMenu(b,Number(b.dataset.more));return}if(b.dataset.menuPlayer!==undefined){setSong(Number(b.dataset.menuPlayer));openPlayer();return}if(b.dataset.menuEntry){const song=songs[Number(b.dataset.menuSong)];notice(`${b.dataset.menuEntry} · ${song?.[0]||''}：已有功能入口，产品接入后打开对应页；当前未修改数据。`);closeSongMenu(true);return}if(b.dataset.entry){notice(`${b.dataset.entry}：已有功能入口，产品接入后打开对应页；当前为设计演示。`);return}
if(b.dataset.page){navigate(b.dataset.page);return}if(b.dataset.settings){state.section=b.dataset.settings;navigate('settings');return}if(b.dataset.library){state.library=b.dataset.library;render();return}
if(b.dataset.theme){state.theme=b.dataset.theme;document.documentElement.classList.toggle('dark',state.theme==='dark');render();return}if(b.dataset.notice){notice(b.dataset.notice);return}
if(b.closest('.segmented')){b.closest('.segmented').querySelectorAll('button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});notice('已在当前页面应用（演示）');return}
if(b.dataset.color){document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('.lyric-preview strong').style.color=b.dataset.color;document.querySelector('.lyric-float p').style.color=b.dataset.color;return}
if(b.dataset.song!==undefined){setSong(Number(b.dataset.song));notice('已切换演示曲目；未播放音频');return}
switch(b.id){case'now-playing-open':openPlayer();break;case'player-back':returnFromPlayer();break;case'player-lyrics':setLyrics(!state.lyrics);break;case'play':state.playing=!state.playing;b.innerHTML=icon(state.playing?'pause':'play');b.setAttribute('aria-label',state.playing?'暂停':'播放');notice(state.playing?'播放状态演示，未输出声音':'已暂停演示');break;case'like':b.classList.toggle('on');break;case'lyrics-toggle':setLyrics(!state.lyrics);break;case'lyrics-close':setLyrics(false);break;case'queue-toggle':setQueue(!state.queue);break;case'queue-close':setQueue(false);break;case'choose-bg':document.getElementById('bg-preview').hidden=false;break;case'cancel-bg':document.getElementById('bg-preview').hidden=true;break;case'source-fail':state.sourceReady=false;render();break;case'source-prepare':state.sourceReady=true;render();notice('内置音源准备流程预览，未下载脚本');break;case'import-backup':document.getElementById('backup-summary').hidden=false;break;case'cancel-import':document.getElementById('backup-summary').hidden=true;break;case'confirm-import':document.getElementById('backup-summary').hidden=true;notice('确认步骤演示，未修改数据');break;}
});
document.addEventListener('input',e=>{const x=e.target;if(x.type==='range'){const out=x.parentElement.querySelector('output');if(out)out.textContent=x.value+(x.hasAttribute('data-eq')?' dB':x.dataset.unit||'%');if(x.getAttribute('aria-label')==='歌词字号'){document.querySelectorAll('.lyric-preview,.lyric-float p').forEach(el=>el.style.fontSize=x.value+'px')}}});
document.addEventListener('change',e=>{const x=e.target;if(x.id==='surround'){state.surround=x.checked;render()}if(x.id==='eq'){state.eq=x.checked;document.querySelectorAll('[data-eq]').forEach(el=>el.disabled=!state.eq)}if(x.id==='desktop-lyrics')setLyrics(x.checked);if(x.id==='auto-source')state.autoSource=x.checked; });
document.getElementById('global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){state.searchQuery=e.target.value;navigate('search')}});
document.addEventListener('keydown',e=>{const anchor=e.target.closest('[data-choice]');if(anchor){const {items}=choiceConfigs.get(anchor.dataset.choice),opened=choiceAnchor===anchor;if(['Enter',' ','ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();if(!opened){openChoice(anchor,e.key==='Home'?0:e.key==='End'?items.length-1:undefined)}else if(e.key==='Enter'||e.key===' '){commitChoice(choiceIndex)}else{moveChoice(e.key==='Home'?0:e.key==='End'?items.length-1:choiceIndex+(e.key==='ArrowDown'?1:-1))}return}if(e.key==='Escape'&&opened){e.preventDefault();closeChoice(true);return}if(e.key==='Tab')closeChoice()}if(e.key==='Escape'){closeChoice(true);closeSongMenu(true);setQueue(false);document.getElementById('toast').hidden=true}});
document.addEventListener('focusin',e=>{if(choiceAnchor&&e.target!==choiceAnchor)closeChoice()});
window.addEventListener('resize',()=>{closeChoice();closeSongMenu()});document.addEventListener('scroll',e=>{if(e.target.closest?.('#choice-menu,#song-menu'))return;if(choiceAnchor){const rect=choiceAnchor.getBoundingClientRect();if(Math.abs(rect.x-choicePosition.x)>.5||Math.abs(rect.y-choicePosition.y)>.5)closeChoice()}closeSongMenu()},true);
document.getElementById('queue-tracks').innerHTML=songs.slice(0,3).map((s,i)=>`<div class="track ${i===0?'active':''}"><span class="cover c${i}">${s[5]}</span><div><strong>${s[0]}</strong><small>${i===0?'正在播放 · ':''}${s[1]}</small></div></div>`).join('');
render();paintIcons();
</script>
</body>
</html>
